# CI runs the same gate as `pnpm check` locally, in the same order, so a green
# local run means a green pipeline.
#
# No secrets are needed anywhere: MODEL_MODE defaults to `scripted`, so the
# whole suite — including the browser tests and the agent evals — runs offline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes back to the repository, so the token needs only to read
# it. Actions are pinned to commit SHAs so a moved tag cannot change what runs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Skip only the browser download; `--ignore-scripts` would also skip
      # esbuild's postinstall, which tsx and Vite need.
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm typecheck
      - run: pnpm lint

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Enforces the line/branch floors in vitest.config.ts, so a change that
      # drops coverage fails here rather than going unnoticed. A dedicated
      # script rather than a forwarded flag: `pnpm test -- --coverage` hands
      # the literal `--` to vitest, which then ignores `--coverage` entirely.
      - run: pnpm test:coverage
      # Evals gate agent behaviour the way unit tests gate code.
      - run: pnpm eval
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `browser` is what Playwright needs installed; `project` is what it
        # runs. They differ for `recovery`, which drives buffer overrun and
        # resync through Chromium against a small-buffer server on 3002/5174.
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: recovery
            browser: chromium
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      # The report is what makes a red CI run diagnosable rather than a rerun.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
